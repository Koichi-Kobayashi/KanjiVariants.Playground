<!doctype html><html lang="ja"><meta charset="utf-8"><title>公式・自前WASM比較（検証専用）</title>
<body><h1>公式・自前WASM比較（検証専用）</h1><p>ローカルHTTP圧縮なし・no-store配信。各エンジン3回、新しいWorkerで初期化。モバイル実機測定ではありません。</p>
<button id="run">比較検証を実行</button><pre id="result" aria-live="polite">未実行</pre>
<script type="module">
const output=document.querySelector('#result');
document.querySelector('#run').onclick=async()=>{
 const runs=[];document.querySelector('#run').disabled=true;
 try {
  const fixtures=await(await fetch('../fixtures.json')).json();
  for(let i=0;i<3;i++)for(const kind of i%2?['self','official']:['official','self']) {
   output.textContent='測定中 '+kind+' '+(i+1)+'/3';
   const started=performance.now(),worker=new Worker('./bench-worker.mjs',{type:'module'});
   const result=await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('timeout')),120000);worker.onerror=e=>{clearTimeout(timer);reject(Error(e.message));};worker.onmessage=({data})=>{clearTimeout(timer);data.error?reject(Error(data.error)):resolve(data);};worker.postMessage({kind,texts:fixtures.map(x=>x.Text)});});
   result.workerRoundTripMs=performance.now()-started;worker.terminate();runs.push(result);
  }
  const reference=JSON.stringify(runs[0].analyses);if(runs.some(x=>JSON.stringify(x.analyses)!==reference))throw Error('Token mismatch');
  const report={fixtureCount:fixtures.length,allTokensEqual:true,runs:runs.map(({analyses,...x})=>x)};
  output.textContent=JSON.stringify(report,null,2);
  const link=document.createElement('a');link.textContent='測定JSONを保存';link.download='browser-comparison.json';link.href=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));document.body.append(link);
 }catch(error){output.textContent=String(error.stack??error);}finally{document.querySelector('#run').disabled=false;}
};
</script></body></html>
