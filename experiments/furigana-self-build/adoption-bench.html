<!doctype html><html lang="ja"><meta charset="utf-8"><title>採用版WASM計測（検証専用）</title>
<h1>採用版WASM計測（検証専用）</h1><p>PC・localhost・no-store・HTTP圧縮なし。新規Worker3回。アプリ全体や実機のピークメモリではありません。</p>
<button id="run">採用版を計測する</button><pre id="result" aria-live="polite">未実行</pre>
<script type="module">
document.querySelector('#run').onclick=async()=>{
 const output=document.querySelector('#result'),runs=[];document.querySelector('#run').disabled=true;
 try {
  for(let i=0;i<3;i++){
   output.textContent=`測定中 ${i+1}/3`;const worker=new Worker('./adoption-bench-worker.mjs',{type:'module'});
   try{runs.push(await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('timeout')),60000);worker.onerror=e=>{clearTimeout(timer);reject(Error(e.message));};worker.onmessage=({data})=>{clearTimeout(timer);data.error?reject(Error(data.error)):resolve(data);};worker.postMessage({});}));}finally{worker.terminate();}
  }
  const client=await import('./js/furigana-client.js'),text='今日は図書館で宇宙の本を読みます。'.repeat(120).slice(0,2000);
  const t=performance.now();await client.analyze(text);const productionClientColdMs=performance.now()-t;
  const t2=performance.now();await client.analyze(text);const productionClientRepeatedMs=performance.now()-t2;client.dispose();
  output.textContent=JSON.stringify({scope:'desktop localhost; experiment stage Worker plus real production client/Worker; not Blazor render latency',runs,productionClientColdMs,productionClientRepeatedMs},null,2);
 }catch(e){output.textContent=String(e.stack??e);}finally{document.querySelector('#run').disabled=false;}
};
</script></html>
