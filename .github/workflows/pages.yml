name: Build and deploy Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore --locked-mode
      - run: dotnet build src/KanjiVariants.Playground -c Debug --no-restore
      - run: dotnet build -c Release --no-restore
      - name: Verify portable symbols and local Git sources
        run: dotnet run --project tools/VerifyPlaygroundArtifacts -c Release -- . --git
      - run: dotnet run --project tests/KanjiVariants.Playground.Checks -c Release --no-build
      - run: node --experimental-default-type=module tests/KanjiVariants.Playground.Checks/FuriganaWorkerChecks.mjs
      - name: Verify adopted self-build assets and notices
        run: node scripts/Verify-FuriganaLicenseEvidence.mjs
      - name: Check distribution tamper rejection
        run: node tests/KanjiVariants.Playground.Checks/FuriganaDistributionChecks.mjs
      - name: Check local path and sensitive string rejection
        run: node tests/KanjiVariants.Playground.Checks/FuriganaPathChecks.mjs
      - run: dotnet publish src/KanjiVariants.Playground -c Release --no-restore -o artifacts/publish
      - name: Prepare subpath and static files
        shell: pwsh
        run: ./scripts/Prepare-Pages.ps1
      - name: Verify published references
        shell: pwsh
        run: ./scripts/Verify-Pages.ps1
      - name: Verify both managed Webcil assemblies
        run: |
          node scripts/Verify-KanjiVariantsDistribution.mjs
          node scripts/Verify-PlaygroundDistribution.mjs
      - name: Verify published self-build and all notices
        run: node scripts/Verify-FuriganaLicenseEvidence.mjs artifacts/publish/wwwroot
      - name: Verify furigana redistribution approval
        shell: pwsh
        run: ./scripts/Verify-FuriganaRedistribution.ps1
      - uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/publish/wwwroot
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
